title: Quarto Word Count
authors:
  - name: Andrew Heiss
    orcid: 0000-0002-3948-3914
  - name: Justin Landis
    orcid: 0000-0001-5501-4934
version: 1.8.0
quarto-required: ">=1.4.551"
contributes:
  shortcodes:
    - "words.lua"
  format:
    common:
      filters:
        - at: pre-quarto
          path: citeproc.lua
      # Local patch: wordcount.lua is NOT declared here. Quarto expands shortcodes
      # AFTER pre-quarto filters and never fires extension-contributed post-quarto
      # filters, so declaring it either way breaks {{< words-* >}}. It is wired
      # directly at post-quarto by tools/build_book.py instead.
      citeproc: false
    html: default
    pdf: default
    docx: default
    markdown: default
