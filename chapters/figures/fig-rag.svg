<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" font-family="DM Sans, sans-serif">
<title>RAG architecture: documents are chunked and embedded once into a local vector store; at query time the question is embedded, nearest chunks are retrieved, and the model answers using question plus retrieved context — all on-premise</title>
<rect width="760" height="260" rx="12" fill="#ffffff"/>
<defs>
<marker id="ra" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#57606a"/></marker>
</defs>
<!-- ingest row -->
<text x="90" y="40" font-size="12" fill="#57606a" font-weight="600" letter-spacing="1">INGEST (once)</text>
<g stroke="#24292f" stroke-width="1.5">
<rect x="30" y="52" width="120" height="44" rx="10" fill="#eef1f6"/>
<rect x="190" y="52" width="100" height="44" rx="10" fill="#eef1f6"/>
<rect x="330" y="52" width="120" height="44" rx="10" fill="#14b8a6" opacity="0.16"/>
</g>
<g font-size="12.5" fill="#24292f" text-anchor="middle" font-weight="600">
<text x="90" y="78">Documents</text><text x="240" y="78">Chunks</text><text x="390" y="78">Vector store</text>
</g>
<g stroke="#57606a" stroke-width="1.5" marker-end="url(#ra)">
<line x1="150" y1="74" x2="186" y2="74"/><line x1="290" y1="74" x2="326" y2="74"/>
</g>
<text x="455" y="79" font-size="11.5" fill="#57606a">local embeddings · stays on disk</text>
<!-- query row -->
<text x="90" y="140" font-size="12" fill="#57606a" font-weight="600" letter-spacing="1">QUERY (every time)</text>
<g stroke="#24292f" stroke-width="1.5">
<rect x="30" y="152" width="120" height="48" rx="10" fill="#fff4ec"/>
<rect x="250" y="146" width="200" height="60" rx="10" fill="#f97316" opacity="0.16"/>
<rect x="550" y="146" width="160" height="60" rx="10" fill="#eef1f6"/>
</g>
<g font-size="12.5" fill="#24292f" text-anchor="middle" font-weight="600">
<text x="90" y="172">Question</text><text x="90" y="189" font-weight="normal" fill="#57606a" font-size="11">user prompt</text>
<text x="350" y="168">Model (local)</text><text x="350" y="185" font-weight="normal" fill="#57606a" font-size="11">question + top-k chunks</text><text x="350" y="199" font-weight="normal" fill="#57606a" font-size="11">→ grounded answer</text>
<text x="630" y="168">Cited answer</text><text x="630" y="185" font-weight="normal" fill="#57606a" font-size="11">with source refs</text>
</g>
<g stroke="#57606a" stroke-width="1.5" marker-end="url(#ra)">
<line x1="150" y1="176" x2="246" y2="176"/><line x1="450" y1="176" x2="546" y2="176"/>
</g>
<!-- retrieval path -->
<path d="M 350 96 L 350 142" fill="none" stroke="#14b8a6" stroke-width="1.8" marker-end="url(#ra)"/>
<text x="362" y="124" font-size="11.5" fill="#14b8a6" font-weight="600">retrieve top-k similar chunks</text>
<text x="380" y="238" font-size="11.5" fill="#57606a" text-anchor="middle">nothing leaves the machine: embeddings, store and inference are all local</text>
</svg>
