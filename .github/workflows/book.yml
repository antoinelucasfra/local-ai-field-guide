name: book

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # actions pinned to SHAs (supply-chain hygiene); bump deliberately
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba # v6
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@91dabb203fce7f899d10ef8e482d94b00f397cbc # v2
        with:
          version: 1.10.18
      - name: Langsel filter regression test
        run: tools/test-langsel.sh
      # PRs check that the book renders; deploys need the decks and the 404 page
      # too. Both call the same script, so CI cannot drift from a local render.
      - name: Render EN
        run: tools/render.sh en
      - name: Render FR
        if: github.event_name != 'pull_request'
        run: tools/render.sh fr
      - name: Assemble site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/en _site/fr
          python3 tools/make_index.py --render _render/en --lang en --out _site/index.html
          cp tools/og-card.* _site/
          cp _render/en/404.html _site/404.html
          # the root 404 page carries absolute /site_libs/... asset links
          cp -r _render/en/site_libs _site/site_libs
          touch _site/.nojekyll
          cp -r _render/en/. _site/en/
          cp -r _render/fr/. _site/fr/
          cp -r code/ _site/code/
          rm -rf _site/en/404.html _site/en/404_files _site/fr/404.html _site/fr/404_files
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: site
          path: _site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release + upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: _site
      - name: Package release assets
        run: |
          V="${GITHUB_REF_NAME}"
          cd _site
          for L in en fr; do
            zip -q "../local-ai-field-guide-book-$V-$L.zip" "$L/book.pdf" "$L/book.epub" "$L/book.docx"
          done
          zip -qr "../local-ai-field-guide-code-$V.zip" code
          zip -qr "../local-ai-field-guide-site-$V.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # idempotent: re-pushing a tag must refresh the assets, not fail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            local-ai-field-guide-book-*.zip local-ai-field-guide-code-*.zip local-ai-field-guide-site-*.zip
